[agents]
enabled = true
# Host-enforced total ceiling. Per-role uniqueness and writing ownership are
# enforced by the orchestration contract and launch receipts.
max_concurrent_threads_per_session = 4
max_depth = 1
# Defensive fallback for untyped calls only. Every typed role launch must
# select and pass an explicit model and reasoning effort; these defaults do
# not define intended typed routing or consequential independent review.
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "low"
